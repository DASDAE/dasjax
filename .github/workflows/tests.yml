name: tests

on:
  push:
  pull_request:

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: "true"
          fetch-depth: "0"
      - uses: j178/prek-action@v2

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: "true"
          fetch-depth: "0"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install package
        run: uv sync --extra test --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --no-sync pytest

  dascore-versions:
    # The parity layer is written against DASCore's behaviour rather than its
    # version number, so cover both of the behaviours that exist: the current
    # release and the branch dasjax is developed against. The matrix above
    # pins neither -- it takes whatever uv resolves.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dascore:
          - "dascore==0.1.21"
          - "dascore @ git+https://github.com/DASDAE/dascore@dev"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: "true"
          fetch-depth: "0"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install package
        run: uv sync --extra test --python 3.12
      # Overlay the DASCore under test onto the synced environment. --no-sync
      # below keeps the next command from resolving it straight back out.
      - name: Install the DASCore under test
        run: uv pip install "${{ matrix.dascore }}"
      - name: Run tests
        run: uv run --no-sync pytest
