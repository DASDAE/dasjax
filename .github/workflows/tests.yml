name: tests

on:
  push:
  pull_request:

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: "true"
          fetch-depth: "0"
      - uses: j178/prek-action@v2

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: "true"
          fetch-depth: "0"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest

  dascore-versions:
    # The parity layer is written against DASCore's behaviour, and that
    # behaviour has changed across the supported range, so cover both ends of
    # it: the floor the package declares and the branch it is developed
    # against. The matrix above pins neither -- it takes whatever pip
    # resolves, which is the latest release and nothing else.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dascore:
          - "dascore==0.1.15"
          - "dascore @ git+https://github.com/DASDAE/dascore@dev"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: "true"
          fetch-depth: "0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Install the DASCore under test
        run: python -m pip install "${{ matrix.dascore }}"
      - name: Run tests
        run: python -m pytest
