[project]
site_name = "dasjax"
site_url = "https://dasdae.github.io/dasjax/"
repo_url = "https://github.com/dasdae/dasjax"
docs_dir = "docs"
site_dir = "site"
nav = [
  {"Home" = "index.md"},
  {"Tutorial" = [
    {"Overview" = "tutorial/index.md"},
    {"Compiled Pipelines" = "tutorial/compiled-pipelines.md"},
    {"Performance" = "tutorial/performance.md"},
  ]},
  {"Benchmarks" = [
    {"Overview" = "benchmarks/index.md"},
    {"Pipelines" = "benchmarks/pipelines.md"},
    {"Methods" = "benchmarks/methods.md"},
  ]},
  {"Development" = [
    {"Overview" = "development/index.md"},
    {"Architecture" = "development/architecture.md"},
    {"Operation Coverage" = "development/operation-coverage.md"},
    {"Documentation" = "development/documentation.md"},
  ]},
  {"API Reference" = [
    {"Overview" = "api/index.md"},
  ]},
]

[project.theme]
variant = "classic"
logo = "static/dasjax_logo.png"
favicon = "static/favicon.ico"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.instant",
  "navigation.tracking",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
